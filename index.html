<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Venora | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="css/login.css">

</head>

<body>

<div class="login-page">

<!-- LEFT SIDE -->

<div class="left-side">

<img src="images/login/login-bg.jpg"
alt="Venora Background">

<div class="overlay"></div>

</div>

<!-- RIGHT SIDE -->

<div class="right-side">

<div class="login-card">

<h2>

Welcome to Venora

</h2>

<p class="subtitle">

Enter your name and email to continue.

</p>

<form id="loginForm">

<div class="input-box">

<i class="bi bi-person"></i>

<input
type="text"
id="name"
placeholder="Your Name"
required>

</div>

<div class="input-box">

<i class="bi bi-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<button
type="submit"
class="login-btn">

Continue

</button>

</form>

</div>

</div>

</div>

<script src="js/login.js"></script>

</body>

</html>
